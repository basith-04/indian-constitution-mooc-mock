<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constitution of India — Mock Test</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fffdf8; --ink:#1f2421; --muted:#68706b;
  --line:#dcd8cf; --accent:#1f5b4a; --accent2:#e7efe9;
  --good:#237a4b; --goodbg:#eaf6ee; --bad:#a83c35; --badbg:#fbeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.container{width:min(920px,calc(100% - 32px));margin:auto}
header{padding:48px 0 30px;border-bottom:1px solid var(--line)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,60px);line-height:.98;margin:12px 0}
.subtitle{color:var(--muted);font-size:16px;max-width:650px;line-height:1.6}
.screen{padding:34px 0 70px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px;text-align:left;cursor:pointer;transition:.18s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode h2{font-family:Georgia,serif;margin:0 0 8px;font-size:25px}
.mode p{color:var(--muted);line-height:1.5;margin:0}
.batch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.batch-btn{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:14px;text-align:left;cursor:pointer}
.batch-btn:hover{border-color:var(--accent);background:#fafbf8}
.batch-btn strong{display:block;font-size:17px;margin-bottom:4px}
.batch-btn span{font-size:13px;color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.progress-wrap{height:7px;background:#e2dfd6;border-radius:20px;overflow:hidden}
.progress{height:100%;background:var(--accent);width:0;transition:.25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:9px 0 26px}
.question-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px}
.qnum{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.question{font-family:Georgia,serif;font-size:clamp(23px,3vw,31px);line-height:1.25;margin:12px 0 25px}
.options{display:grid;gap:11px}
.option{border:1px solid var(--line);background:#fffefa;border-radius:13px;padding:15px 16px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.option:hover:not(:disabled){border-color:var(--accent);background:#f8faf7}
.option .letter{width:27px;height:27px;min-width:27px;border-radius:50%;background:#eeece5;display:grid;place-items:center;font-size:12px;font-weight:800}
.option.selected-correct{border-color:var(--good);background:var(--goodbg)}
.option.selected-correct .letter{background:var(--good);color:white}
.option.selected-wrong{border-color:var(--bad);background:var(--badbg)}
.option.selected-wrong .letter{background:var(--bad);color:white}
.option.reveal-correct{border-color:var(--good);background:var(--goodbg)}
.feedback{margin-top:18px;padding:15px 16px;border-radius:13px;line-height:1.5;font-size:14px}
.feedback.good{background:var(--goodbg);color:#185b38}
.feedback.bad{background:var(--badbg);color:#7e2d28}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:11px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 25px}
.score-number{font:700 72px Georgia,serif;color:var(--accent)}
.score p{color:var(--muted)}
.breakdown{margin:25px auto 0;max-width:500px;text-align:left}
.breakdown div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0}
.hidden{display:none!important}
.back{border:none;background:none;color:var(--muted);cursor:pointer;padding:0;margin-bottom:20px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 0 35px}
@media(max-width:650px){
 .modes{grid-template-columns:1fr}.batch-grid{grid-template-columns:1fr 1fr}
 .question-card{padding:21px}.question{font-size:24px}
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="kicker">Exam Practice</div>
  <h1>Constitution of India</h1>
  <div class="subtitle">150-question practice set. Choose a batch or take a 50-question random mock from the complete question bank.</div>
</header>

<main class="screen">
  <section id="home">
    <div class="modes">
      <button class="mode" onclick="showBatches()">
        <h2>Batch-by-batch</h2>
        <p>Practice 30 questions at a time. Five batches cover all 150 questions.</p>
      </button>
      <button class="mode" onclick="startOverall()">
        <h2>Overall Mock</h2>
        <p>Get 50 questions selected randomly from the complete 150-question bank.</p>
      </button>
    </div>
  </section>

  <section id="batches" class="hidden">
    <button class="back" onclick="goHome()">← Back</button>
    <h2>Choose a batch</h2>
    <div class="batch-grid">
      <button class="batch-btn" onclick="startBatch(1)"><strong>Batch 1</strong><span>Questions 1–30</span></button>
      <button class="batch-btn" onclick="startBatch(2)"><strong>Batch 2</strong><span>Questions 31–60</span></button>
      <button class="batch-btn" onclick="startBatch(3)"><strong>Batch 3</strong><span>Questions 61–90</span></button>
      <button class="batch-btn" onclick="startBatch(4)"><strong>Batch 4</strong><span>Questions 91–120</span></button>
      <button class="batch-btn" onclick="startBatch(5)"><strong>Batch 5</strong><span>Questions 121–150</span></button>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <button class="back" onclick="goHome()">← Exit test</button>
    <div class="topbar">
      <strong id="modeTitle"></strong>
      <span id="scoreLive"></span>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="meta"><span id="counter"></span><span>Answer is revealed immediately</span></div>

    <div class="question-card">
      <div class="qnum" id="qnum"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div id="feedback"></div>
    </div>
    <div class="controls">
      <button class="btn" id="prevBtn" onclick="prevQuestion()">← Previous</button>
      <button class="btn primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
    </div>
  </section>

  <section id="result" class="hidden">
    <button class="back" onclick="goHome()">← Back to home</button>
    <div class="score">
      <div class="kicker">Test complete</div>
      <div class="score-number" id="finalScore"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="breakdown">
        <div><span>Correct</span><strong id="correctCount"></strong></div>
        <div><span>Wrong</span><strong id="wrongCount"></strong></div>
        <div><span>Unanswered</span><strong id="skipCount"></strong></div>
        <div><span>Total</span><strong id="totalCount"></strong></div>
      </div>
      <div style="margin-top:25px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" onclick="restartSame()">Retry</button>
        <button class="btn" onclick="goHome()">Home</button>
      </div>
    </div>
  </section>
</main>

<footer>Constitution of India Mock Test · by Basith</footer>
</div>

rticles 14 to 18", "Articles 19 to 22", "Articles 23 to 24", "Articles 25 to 28"], "answer": 0}, {"batch": 1, "q": "Article 14 of the Constitution guarantees:", "options": ["Right to freedom of speech", "Equality before law and equal protection of laws", "Right to education", "Right against exploitation"], "answer": 1}, {"batch": 1, "q": "The executive power of the Union is vested in the:", "options": ["Prime Minister", "President", "Council of Ministers", "Parliament"], "answer": 1}, {"batch": 1, "q": "The President of India is elected by an Electoral College consisting of:", "options": ["Elected members of both Houses of Parliament and elected members of State Legislative Assemblies", "Only Members of Parliament", "Only State Legislative Assembly members", "The Council of Ministers"], "answer": 0}, {"batch": 1, "q": "The manner/election of the President is provided under which Article?", "options": ["Article 54", "Article 61", "Article 72", "Article 79"], "answer": 0}, {"batch": 1, "q": "What is the term of office of the President of India?", "options": ["4 years", "5 years", "6 years", "7 years"], "answer": 1}, {"batch": 1, "q": "The minimum age required to be eligible for election as President of India is:", "options": ["25 years", "30 years", "35 years", "40 years"], "answer": 2}, {"batch": 1, "q": "The impeachment of the President for violation of the Constitution is provided under which Article?", "options": ["Article 61", "Article 72", "Article 76", "Article 74"], "answer": 0}, {"batch": 1, "q": "The executive power of a State is vested in the:", "options": ["Chief Minister", "Governor", "Council of Ministers", "State Legislature"], "answer": 1}, {"batch": 1, "q": "The Governor of a State is appointed by:", "options": ["The President", "The Prime Minister", "The Chief Minister", "The people of the State"], "answer": 0}, {"batch": 1, "q": "The minimum age required to be eligible to become a Governor is:", "options": ["25 years", "30 years", "35 years", "40 years"], "answer": 2}, {"batch": 1, "q": "The normal term of office of a Governor is:", "options": ["4 years", "5 years, subject to the pleasure of the President", "6 years", "Life tenure"], "answer": 1}, {"batch": 1, "q": "Article 163 of the Constitution provides for a Council of Ministers to aid and advise the:", "options": ["Governor", "President", "Chief Justice of High Court", "Speaker of the Assembly"], "answer": 0}, {"batch": 1, "q": "The Chief Minister of a State is appointed by:", "options": ["The Governor", "The President", "The Speaker", "The Chief Justice of the High Court"], "answer": 0}, {"batch": 1, "q": "Legislative relations between the Union and States are dealt with under which Part?", "options": ["Part XI", "Part XII", "Part XIII", "Part XIV"], "answer": 0}, {"batch": 1, "q": "The distribution of legislative powers between Union and States is based on:", "options": ["Union List, State List and Concurrent List", "Only a single combined list", "Union List only", "Residuary powers with the States only"], "answer": 0}, {"batch": 1, "q": "In case of a conflict between a Union law and a State law on a subject in the Concurrent List, generally:", "options": ["The State law prevails always", "The Union law prevails, subject to certain exceptions", "Both laws become void", "The matter goes to the Governor"], "answer": 1}, {"batch": 1, "q": "Residuary powers of legislation rest with:", "options": ["The States", "The Union Parliament", "Local bodies", "The Judiciary"], "answer": 1}, {"batch": 1, "q": "Administrative relations between the Union and States are provided under which Part?", "options": ["Part XI", "Part XII", "Part XIII", "Part XIV"], "answer": 0}, {"batch": 1, "q": "Under administrative relations, the Union can give directions to States regarding:", "options": ["Construction and maintenance of means of communication of national importance", "Selection of the Chief Minister", "Formation of political parties", "State budget preparation"], "answer": 0}, {"batch": 2, "q": "The Indian Constitution is often described as 'borrowed' because it draws features from various countries; this makes it a:", "options": ["Rigid document", "Bag of borrowings", "Unitary document only", "Unwritten constitution"], "answer": 1}, {"batch": 2, "q": "Which of the following best describes the Indian Constitution in terms of length?", "options": ["Shortest written constitution in the world", "One of the lengthiest written constitutions in the world", "An unwritten constitution", "A purely oral tradition"], "answer": 1}, {"batch": 2, "q": "The Indian Constitution is:", "options": ["Purely federal", "Purely unitary", "Federal in form and unitary in spirit (quasi-federal)", "Confederal"], "answer": 2}, {"batch": 2, "q": "Which feature of the Indian Constitution provides for a single, integrated judicial system?", "options": ["Dual judiciary", "Single integrated judiciary", "No judiciary", "Separate judiciary for each state"], "answer": 1}, {"batch": 2, "q": "India has a Parliamentary form of government at the Centre, modeled on the:", "options": ["American system", "British system", "French system", "Swiss system"], "answer": 1}, {"batch": 2, "q": "The concept of 'Rule of Law' in the Indian Constitution was borrowed from:", "options": ["USA", "Ireland", "Britain", "Canada"], "answer": 2}, {"batch": 2, "q": "Article 15 prohibits discrimination on grounds of:", "options": ["Religion, race, caste, sex or place of birth", "Property only", "Political opinion only", "Age only"], "answer": 0}, {"batch": 2, "q": "Article 16 guarantees equality of opportunity in matters of:", "options": ["Public employment", "Marriage", "Religion", "Education only"], "answer": 0}, {"batch": 2, "q": "Article 17 of the Constitution deals with:", "options": ["Abolition of Untouchability", "Abolition of Titles", "Right to Property", "Freedom of Press"], "answer": 0}, {"batch": 2, "q": "Article 18 of the Constitution deals with:", "options": ["Abolition of Untouchability", "Abolition of Titles", "Right to Equality before law", "Right to freedom of religion"], "answer": 1}, {"batch": 2, "q": "The Right to Freedom is guaranteed under which Articles?", "options": ["Articles 19 to 22", "Articles 23 to 24", "Articles 25 to 28", "Articles 29 to 30"], "answer": 0}, {"batch": 2, "q": "Article 19 of the Constitution guarantees how many fundamental freedoms?", "options": ["Four", "Five", "Six", "Seven"], "answer": 2}, {"batch": 2, "q": "The Vice President of India acts as ex-officio Chairman of which body?", "options": ["Lok Sabha", "Rajya Sabha", "Supreme Court", "Planning Commission"], "answer": 1}, {"batch": 2, "q": "The Vice President is elected by:", "options": ["Members of both Houses of Parliament", "Members of Rajya Sabha only", "The Electoral College including State Assemblies", "The President alone"], "answer": 0}, {"batch": 2, "q": "What is the term of office of the Vice President of India?", "options": ["4 years", "5 years", "6 years", "No fixed term"], "answer": 1}, {"batch": 2, "q": "Article 74 of the Constitution provides for a Council of Ministers to:", "options": ["Aid and advise the President", "Aid and advise the Governor", "Assist the Chief Justice", "Assist the Speaker"], "answer": 0}, {"batch": 2, "q": "The Council of Ministers is collectively responsible to:", "options": ["The President", "The Rajya Sabha", "The Lok Sabha (House of the People)", "The Supreme Court"], "answer": 2}, {"batch": 2, "q": "The Prime Minister of India is appointed by:", "options": ["The President", "The Chief Justice", "The Speaker of Lok Sabha", "The Rajya Sabha Chairman"], "answer": 0}, {"batch": 2, "q": "The Council of Ministers in a State is collectively responsible to:", "options": ["The Governor", "The Legislative Assembly", "The President", "The High Court"], "answer": 1}, {"batch": 2, "q": "The highest law officer of a State, who advises the State Government on legal matters, is the:", "options": ["Attorney General", "Advocate General", "Solicitor General", "Chief Justice"], "answer": 1}, {"batch": 2, "q": "The Advocate General of a State is appointed under which Article?", "options": ["Article 165", "Article 76", "Article 124", "Article 214"], "answer": 0}, {"batch": 2, "q": "The Advocate General holds office during the pleasure of the:", "options": ["Governor", "President", "Chief Minister", "Chief Justice"], "answer": 0}, {"batch": 2, "q": "Union Territories are administered by the President through an Administrator, who may be designated as:", "options": ["Lieutenant Governor or Administrator", "Chief Minister", "Governor only", "Prime Minister's nominee"], "answer": 0}, {"batch": 2, "q": "Which Article of the Constitution provides for the administration of Union Territories?", "options": ["Article 239", "Article 1", "Article 3", "Article 240"], "answer": 0}, {"batch": 2, "q": "The Inter-State Council is established under which Article?", "options": ["Article 263", "Article 280", "Article 268", "Article 2"], "answer": 0}, {"batch": 2, "q": "The Inter-State Council's main function is to:", "options": ["Prepare the Union Budget", "Inquire into and advise on disputes between States", "Appoint Governors", "Conduct elections"], "answer": 1}, {"batch": 2, "q": "Financial relations between the Union and States are dealt with under which Part?", "options": ["Part XII", "Part X", "Part XI", "Part XIII"], "answer": 0}, {"batch": 2, "q": "The Finance Commission is constituted under which Article?", "options": ["Article 280", "Article 281", "Article 20", "Article 263"], "answer": 0}, {"batch": 2, "q": "The Finance Commission is constituted by the President every:", "options": ["3 years", "4 years", "5 years", "6 years"], "answer": 2}, {"batch": 2, "q": "The main function of the Finance Commission is to recommend:", "options": ["Distribution of financial resources between Union and States", "Appointment of Governors", "Election schedules", "Judicial appointments"], "answer": 0}, {"batch": 3, "q": "The let quiz = [];
let current = 0;
let answers = [];
let mode = "";
let lastBatch = null;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function hideAll(){
  ["home","batches","quiz","result"].forEach(id=>document.getElementById(id).classList.add("hidden"));
}
function goHome(){ hideAll(); document.getElementById("home").classList.remove("hidden"); }
function showBatches(){ hideAll(); document.getElementById("batches").classList.remove("hidden"); }

function startBatch(batch){
  lastBatch = batch;
  mode = "Batch " + batch;
  quiz = BANK.filter(x=>x.batch===batch);
  begin();
}

function startOverall(){
  lastBatch = null;
  mode = "Overall Mock";
  quiz = shuffle(BANK).slice(0,50);
  begin();
}

function begin(){
  current=0;
  answers=new Array(quiz.length).fill(null);
  hideAll();
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("modeTitle").textContent=mode;
  render();
}

function render(){
  const item=quiz[current];
  document.getElementById("counter").textContent=`Question ${current+1} of ${quiz.length}`;
  document.getElementById("qnum").textContent=`Question ${current+1}`;
  document.getElementById("question").textContent=item.q;
  document.getElementById("progress").style.width=((current+1)/quiz.length*100)+"%";
  document.getElementById("prevBtn").disabled=current===0;
  document.getElementById("nextBtn").textContent=current===quiz.length-1?"Finish →":"Next →";
  document.getElementById("scoreLive").textContent=`${answers.filter((a,i)=>a!==null && a===quiz[i].answer).length} correct`;

  const options=document.getElementById("options");
  options.innerHTML="";
  item.options.forEach((text,i)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.disabled=answers[current]!==null;
    if(answers[current]!==null){
      if(i===answers[current] && i===item.answer) btn.classList.add("selected-correct");
      if(i===answers[current] && i!==item.answer) btn.classList.add("selected-wrong");
      if(i===item.answer) btn.classList.add("reveal-correct");
    }
    btn.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(text)}</span>`;
    btn.onclick=()=>choose(i);
    options.appendChild(btn);
  });

  const fb=document.getElementById("feedback");
  fb.innerHTML="";
  if(answers[current]!==null){
    const correct=answers[current]===item.answer;
    fb.className="feedback "+(correct?"good":"bad");
    fb.innerHTML=correct
      ? `<strong>Correct.</strong> The answer is ${String.fromCharCode(65+item.answer)} — ${escapeHtml(item.options[item.answer])}.`
      : `<strong>Incorrect.</strong> The correct answer is ${String.fromCharCode(65+item.answer)} — ${escapeHtml(item.options[item.answer])}.`;
  }else{
    fb.className="";
  }
}

function choose(index){
  if(answers[current]!==null) return;
  answers[current]=index;
  render();
}
function nextQuestion(){
  if(current<quiz.length-1){current++;render();}
  else finish();
}
function prevQuestion(){if(current>0){current--;render();}}

function finish(){
  hideAll();
  document.getElementById("result").classList.remove("hidden");
  const correct=answers.reduce((n,a,i)=>n+(a!==null&&a===quiz[i].answer?1:0),0);
  const wrong=answers.reduce((n,a,i)=>n+(a!==null&&a!==quiz[i].answer?1:0),0);
  const skipped=answers.filter(a=>a===null).length;
  document.getElementById("finalScore").textContent=`${correct}/${quiz.length}`;
  document.getElementById("correctCount").textContent=correct;
  document.getElementById("wrongCount").textContent=wrong;
  document.getElementById("skipCount").textContent=skipped;
  document.getElementById("totalCount").textContent=quiz.length;
  const pct=Math.round(correct/quiz.length*100);
  document.getElementById("resultTitle").textContent=pct>=90?"Excellent":pct>=75?"Strong score":pct>=60?"Needs another revision":"Revise the weak areas";
  document.getElementById("resultText").textContent=`You scored ${pct}%. Answers were revealed immediately during the test.`;
}
function restartSame(){
  if(lastBatch) startBatch(lastBatch);
  else startOverall();
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
